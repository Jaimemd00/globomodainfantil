<svg xmlns="http://www.w3.org/2000/svg" viewBox="860 15 740 465" width="740" height="465" role="img" aria-label="Ilustración de Black Friday: bolsas de compra, regalo, globos y etiquetas en tonos pastel">
  <defs>
    <linearGradient id="bf-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4f8"/>
      <stop offset="0.55" stop-color="#fbdce8"/>
      <stop offset="1" stop-color="#ebe0f6"/>
    </linearGradient>
    <linearGradient id="bf-bolsa-rosa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9cfe0"/>
      <stop offset="1" stop-color="#f4a9c5"/>
    </linearGradient>
    <linearGradient id="bf-bolsa-negra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4552"/>
      <stop offset="1" stop-color="#352f39"/>
    </linearGradient>
    <linearGradient id="bf-caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7efe3"/>
      <stop offset="1" stop-color="#8bdcc6"/>
    </linearGradient>
    <filter id="bf-sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a4a63" flood-opacity="0.18"/>
    </filter>
  </defs>


  <!-- manchas suaves de fondo -->
  <circle cx="1240" cy="250" r="210" fill="#ffffff" opacity="0.45"/>

  <!-- confeti: pastel + algún punto grafito (el guiño a Black Friday) -->
  <g>
    <circle cx="905" cy="95" r="6" fill="#f4a9c5"/>
    <circle cx="1010" cy="60" r="4" fill="#403a44"/>
    <circle cx="1120" cy="120" r="5" fill="#8bdcc6"/>
    <circle cx="1370" cy="55" r="5" fill="#403a44"/>
    <circle cx="1555" cy="250" r="6" fill="#f4a9c5"/>
    <circle cx="1440" cy="420" r="5" fill="#c1aad4"/>
    <circle cx="880" cy="300" r="4" fill="#c1aad4"/>
    <rect x="1060" y="380" width="12" height="5" rx="2" fill="#403a44" transform="rotate(30 1066 382)"/>
    <rect x="1300" y="150" width="12" height="5" rx="2" fill="#f4a9c5" transform="rotate(-25 1306 152)"/>
    <rect x="1520" y="350" width="12" height="5" rx="2" fill="#8bdcc6" transform="rotate(55 1526 352)"/>
  </g>
  <g fill="#ffffff">
    <path d="M985 230 l5 13 13 5 -13 5 -5 13 -5-13 -13-5 13-5z"/>
    <path d="M1515 165 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z"/>
  </g>

  <!-- globos de la marca, arriba a la derecha -->
  <g transform="translate(1420 150)">
    <path d="M-40 52 q8 60 -8 120" fill="none" stroke="#dcb6ca" stroke-width="2.5"/>
    <path d="M10 36 q10 70 -6 140" fill="none" stroke="#c1aad4" stroke-width="2.5"/>
    <path d="M58 56 q8 56 -6 116" fill="none" stroke="#8bdcc6" stroke-width="2.5"/>
    <ellipse cx="-40" cy="0" rx="40" ry="50" fill="#f8c4d8"/>
    <ellipse cx="-53" cy="-16" rx="11" ry="16" fill="#fff" opacity="0.55"/>
    <ellipse cx="10" cy="-18" rx="38" ry="48" fill="#d6c5e8"/>
    <ellipse cx="-2" cy="-34" rx="10" ry="15" fill="#fff" opacity="0.55"/>
    <ellipse cx="58" cy="4" rx="36" ry="46" fill="#b0e7d7"/>
    <ellipse cx="47" cy="-12" rx="10" ry="14" fill="#fff" opacity="0.55"/>
  </g>

  <!-- barra y etiquetas colgando (sin porcentajes: no prometen descuentos que no hay) -->
  <rect x="930" y="40" width="330" height="6" rx="3" fill="#c1aad4" opacity="0.7"/>
  <g font-family="'Quicksand','Trebuchet MS',sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(985 43) rotate(-7)">
      <line x1="0" y1="0" x2="0" y2="34" stroke="#bba0c1" stroke-width="2.5"/>
      <path d="M-40 34 h72 a9 9 0 0 1 9 9 v62 a9 9 0 0 1 -9 9 h-72 a9 9 0 0 1 -9 -9 v-62 a9 9 0 0 1 9 -9z" fill="#403a44"/>
      <circle cx="-26" cy="48" r="5.5" fill="#fbdce8"/>
      <text x="-4" y="90" font-size="24" fill="#fff4e2">SALE</text>
    </g>
    <g transform="translate(1105 43) rotate(6)">
      <line x1="0" y1="0" x2="0" y2="50" stroke="#bba0c1" stroke-width="2.5"/>
      <path d="M-36 50 h64 a9 9 0 0 1 9 9 v56 a9 9 0 0 1 -9 9 h-64 a9 9 0 0 1 -9 -9 v-56 a9 9 0 0 1 9 -9z" fill="#f8c4d8"/>
      <circle cx="-22" cy="64" r="5.5" fill="#fdf4f8"/>
      <text x="-2" y="102" font-size="30" fill="#443e48">%</text>
    </g>
    <g transform="translate(1215 43) rotate(-4)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#bba0c1" stroke-width="2.5"/>
      <path d="M-34 28 h60 a9 9 0 0 1 9 9 v54 a9 9 0 0 1 -9 9 h-60 a9 9 0 0 1 -9 -9 v-54 a9 9 0 0 1 9 -9z" fill="#b0e7d7"/>
      <circle cx="-20" cy="42" r="5.5" fill="#fdf4f8"/>
      <text x="-2" y="80" font-size="24" fill="#443e48">BF</text>
    </g>
  </g>

  <!-- bolsa grafito (Black Friday) -->
  <g filter="url(#bf-sombra)" transform="translate(1030 205)">
    <path d="M30 40 q0 -46 46 -46 q46 0 46 46" fill="none" stroke="#352f39" stroke-width="9" stroke-linecap="round"/>
    <path d="M0 40 h152 l-10 196 h-132z" fill="url(#bf-bolsa-negra)"/>
    <path d="M0 40 h152 l-2 22 h-148z" fill="#5a525f"/>
    <text x="76" y="140" text-anchor="middle" font-family="'Quicksand','Trebuchet MS',sans-serif" font-weight="700" font-size="22" fill="#fff4e2" letter-spacing="3">BLACK</text>
    <text x="76" y="170" text-anchor="middle" font-family="'Quicksand','Trebuchet MS',sans-serif" font-weight="700" font-size="22" fill="#fff4e2" letter-spacing="3">FRIDAY</text>
    <rect x="46" y="186" width="60" height="4" rx="2" fill="#f4a9c5"/>
  </g>

  <!-- bolsa rosa con el sello de Globo -->
  <g filter="url(#bf-sombra)" transform="translate(1180 245)">
    <path d="M34 36 q0 -42 42 -42 q42 0 42 42" fill="none" stroke="#e48fb0" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 36 h152 l-9 180 h-134z" fill="url(#bf-bolsa-rosa)"/>
    <path d="M0 36 h152 l-2 20 h-148z" fill="#f9d7e5"/>
    <circle cx="76" cy="138" r="48" fill="#fff" stroke="#443e48" stroke-width="3.6"/>
    <ellipse cx="59" cy="126" rx="13.5" ry="17" fill="#f8c4d8"/>
    <ellipse cx="80" cy="117" rx="12.5" ry="16" fill="#d6c5e8"/>
    <ellipse cx="93" cy="133" rx="11" ry="14.5" fill="#b0e7d7"/>
  </g>

  <!-- caja regalo menta con lazo lila -->
  <g filter="url(#bf-sombra)" transform="translate(1350 320)">
    <rect x="0" y="38" width="150" height="112" rx="10" fill="url(#bf-caja)"/>
    <rect x="-8" y="18" width="166" height="34" rx="9" fill="#b0e7d7"/>
    <rect x="62" y="18" width="26" height="132" fill="#c1aad4"/>
    <path d="M75 18 c-26 -34 -66 -24 -56 -4 c8 14 40 6 56 4z" fill="#d6c5e8"/>
    <path d="M75 18 c26 -34 66 -24 56 -4 c-8 14 -40 6 -56 4z" fill="#d6c5e8"/>
    <circle cx="75" cy="18" r="9" fill="#c1aad4"/>
  </g>

  <!-- corazoncito -->
  <path d="M955 175 c-6 -10 -22 -6 -22 6 c0 10 22 22 22 22 c0 0 22 -12 22 -22 c0 -12 -16 -16 -22 -6z" fill="#f4a9c5" opacity="0.75"/>
</svg>
