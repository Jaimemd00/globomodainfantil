<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Ilustración de Halloween con calabazas y fantasmas en tonos pastel">
  <defs>
    <linearGradient id="hw-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6cf"/>
      <stop offset="0.55" stop-color="#ffd7b0"/>
      <stop offset="1" stop-color="#f6c9d6"/>
    </linearGradient>
    <radialGradient id="hw-luna" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff4e2"/>
      <stop offset="1" stop-color="#f9e5ba"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#hw-fondo)"/>

  <!-- luna y estrellitas -->
  <circle cx="1190" cy="120" r="66" fill="url(#hw-luna)"/>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="980" cy="70" r="3.5"/><circle cx="1060" cy="150" r="2.5"/>
    <circle cx="1320" cy="90" r="3"/><circle cx="1420" cy="170" r="2.5"/>
    <circle cx="1270" cy="210" r="2.5"/><circle cx="900" cy="130" r="2.5"/>
  </g>
  <g fill="#e6945a" opacity="0.5">
    <path d="M1360 60 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z"/>
    <path d="M1120 230 l3 8 8 3 -8 3 -3 8 -3-8 -8-3 8-3z"/>
  </g>

  <!-- murciélagos pastel (lila), redondeados -->
  <g fill="#c1aad4">
    <g transform="translate(1000 110)">
      <circle cx="0" cy="0" r="12"/>
      <path d="M-10 -2 C-28 -16 -44 -10 -50 2 C-40 -2 -30 2 -22 10 C-18 2 -14 0 -10 2z"/>
      <path d="M10 -2 C28 -16 44 -10 50 2 C40 -2 30 2 22 10 C18 2 14 0 10 2z"/>
    </g>
    <g transform="translate(1310 250) scale(0.8)">
      <circle cx="0" cy="0" r="12"/>
      <path d="M-10 -2 C-28 -16 -44 -10 -50 2 C-40 -2 -30 2 -22 10 C-18 2 -14 0 -10 2z"/>
      <path d="M10 -2 C28 -16 44 -10 50 2 C40 -2 30 2 22 10 C18 2 14 0 10 2z"/>
    </g>
  </g>

  <!-- fantasma tierno -->
  <g transform="translate(1430 250)">
    <path d="M0 -70 C40 -70 62 -40 62 0 L62 70 C62 82 50 82 44 72 C40 84 28 84 24 72 C20 84 8 84 4 72 C-2 84 -14 84 -18 72 C-24 82 -38 82 -38 70 L-38 0 C-38 -40 -40 -70 0 -70 Z" fill="#ffffff" opacity="0.96"/>
    <circle cx="-14" cy="-18" r="7" fill="#443e48"/>
    <circle cx="20" cy="-18" r="7" fill="#443e48"/>
    <circle cx="-16" cy="-15" r="2.2" fill="#fff"/>
    <circle cx="18" cy="-15" r="2.2" fill="#fff"/>
    <ellipse cx="3" cy="2" rx="9" ry="11" fill="#f4a9c5" opacity="0.6"/>
    <circle cx="-30" cy="4" r="6" fill="#f4a9c5" opacity="0.45"/>
    <circle cx="36" cy="4" r="6" fill="#f4a9c5" opacity="0.45"/>
  </g>

  <!-- calabazas -->
  <g transform="translate(1150 350)">
    <!-- calabaza grande -->
    <g transform="translate(0 0)">
      <rect x="-6" y="-78" width="12" height="20" rx="5" fill="#8bdcc6"/>
      <path d="M-8 -70 C-30 -84 -48 -70 -40 -56" fill="none" stroke="#63cfb3" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="78" ry="62" fill="#f79a4d"/>
      <ellipse cx="-34" cy="0" rx="26" ry="60" fill="#e6945a" opacity="0.55"/>
      <ellipse cx="34" cy="0" rx="26" ry="60" fill="#e6945a" opacity="0.55"/>
      <ellipse cx="0" cy="0" rx="20" ry="60" fill="#ffb877" opacity="0.6"/>
      <!-- carita feliz -->
      <path d="M-40 -6 l20 16 -24 4z" fill="#5a3d2b"/>
      <path d="M40 -6 l-20 16 24 4z" fill="#5a3d2b"/>
      <path d="M-34 28 q34 26 68 0 q-14 -8 -22 2 q-12 -8 -24 0 q-10 -8 -22 -2z" fill="#5a3d2b"/>
    </g>
    <!-- calabaza pequeña -->
    <g transform="translate(118 26) scale(0.62)">
      <rect x="-6" y="-78" width="12" height="20" rx="5" fill="#8bdcc6"/>
      <ellipse cx="0" cy="0" rx="78" ry="62" fill="#ffb877"/>
      <ellipse cx="-34" cy="0" rx="24" ry="58" fill="#f79a4d" opacity="0.5"/>
      <ellipse cx="34" cy="0" rx="24" ry="58" fill="#f79a4d" opacity="0.5"/>
      <circle cx="-26" cy="-4" r="7" fill="#5a3d2b"/>
      <circle cx="26" cy="-4" r="7" fill="#5a3d2b"/>
      <path d="M-22 22 q22 20 44 0" fill="none" stroke="#5a3d2b" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- telaraña esquina superior derecha -->
  <g stroke="#e6945a" stroke-width="2" fill="none" opacity="0.4" transform="translate(1600 0)">
    <path d="M0 0 L-70 0 M0 0 L-60 24 M0 0 L-42 42 M0 0 L-24 60 M0 0 L0 70"/>
    <path d="M-20 0 q-6 6 0 20 q6 6 20 0"/>
    <path d="M-44 0 q-14 14 0 44 q14 14 44 0"/>
  </g>
</svg>
