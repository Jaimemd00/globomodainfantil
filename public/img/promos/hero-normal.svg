<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Ilustración de los tres globos de Globo Moda Infantil en tonos pastel">
  <defs>
    <linearGradient id="nm-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf4f8"/>
      <stop offset="0.5" stop-color="#fbdce8"/>
      <stop offset="1" stop-color="#ebe0f6"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#nm-fondo)"/>

  <!-- nubes suaves -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="1050" cy="110" rx="70" ry="30"/>
    <ellipse cx="1100" cy="100" rx="50" ry="26"/>
    <ellipse cx="1380" cy="190" rx="80" ry="32"/>
    <ellipse cx="1440" cy="180" rx="52" ry="26"/>
  </g>

  <!-- puntitos / confeti pastel -->
  <g opacity="0.8">
    <circle cx="930" cy="80" r="5" fill="#f4a9c5"/>
    <circle cx="1240" cy="70" r="5" fill="#8bdcc6"/>
    <circle cx="1500" cy="110" r="5" fill="#c1aad4"/>
    <circle cx="880" cy="200" r="4" fill="#c1aad4"/>
    <circle cx="1320" cy="300" r="5" fill="#f4a9c5"/>
  </g>

  <!-- tres globos (rosa, lila, menta) con cuerdas -->
  <g transform="translate(1230 250)">
    <path d="M-70 30 q10 70 -6 150" fill="none" stroke="#dcb6ca" stroke-width="3"/>
    <path d="M10 10 q12 80 -4 170" fill="none" stroke="#c1aad4" stroke-width="3"/>
    <path d="M86 34 q10 66 -6 146" fill="none" stroke="#8bdcc6" stroke-width="3"/>

    <g>
      <ellipse cx="-70" cy="-20" rx="62" ry="76" fill="#f8c4d8"/>
      <ellipse cx="-90" cy="-44" rx="18" ry="26" fill="#ffffff" opacity="0.5"/>
      <path d="M-70 56 l-9 12 18 0z" fill="#f4a9c5"/>
    </g>
    <g>
      <ellipse cx="10" cy="-44" rx="60" ry="74" fill="#d6c5e8"/>
      <ellipse cx="-8" cy="-66" rx="17" ry="24" fill="#ffffff" opacity="0.5"/>
      <path d="M10 30 l-9 12 18 0z" fill="#c1aad4"/>
    </g>
    <g>
      <ellipse cx="86" cy="-16" rx="58" ry="72" fill="#b0e7d7"/>
      <ellipse cx="68" cy="-38" rx="16" ry="23" fill="#ffffff" opacity="0.5"/>
      <path d="M86 56 l-9 12 18 0z" fill="#8bdcc6"/>
    </g>
  </g>

  <!-- corazoncitos -->
  <g fill="#f4a9c5" opacity="0.6">
    <path d="M1020 330 c-6 -10 -22 -6 -22 6 c0 10 22 22 22 22 c0 0 22 -12 22 -22 c0 -12 -16 -16 -22 -6z"/>
    <path d="M1470 330 c-5 -8 -18 -5 -18 5 c0 8 18 18 18 18 c0 0 18 -10 18 -18 c0 -10 -13 -13 -18 -5z" opacity="0.5"/>
  </g>
</svg>
